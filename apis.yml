aid: veefriends
name: VeeFriends
description: VeeFriends is a character-driven collectibles and entertainment company
  founded by Gary Vaynerchuk, built around 250+ original characters that embody human
  values like empathy, patience, and kindness. Operated by Vee Friends, LLC out of
  New York, the brand spans NFT collections (Series 1, Series 2, Iconics, Book Games),
  Topps Chrome trading cards and a trading card game, comic books and cartoons, collectible
  stickers and pins, apparel and plush merchandise, and the Burn Island platform where
  holders burn NFTs to unlock rare collectibles, events, and prizes. VeeFriends is
  an a16z portfolio company and publishes no public developer API surface today.
